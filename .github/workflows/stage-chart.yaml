name: Stage chart

# Charts v2: stage the rancher-compliance and rancher-compliance-crd charts as
# OCI artifacts in the staging registry with cargueiro. Releasing them is
# handled on the rancher/charts side. See
# https://github.com/rancher/cargueiro/blob/main/docs/CHART_OWNER.md
#
# The ship-family-staged action of rancher/charts stamps, checks, packages and
# pushes the charts, and then starts the chart-staged workflow of rancher/charts,
# which ships them and opens a pull request against its staging branch. It reads
# the staging registry credentials and the rancher-gh-workflow-dispatcher GitHub
# App credentials from the Vault path of this repository. The chart version is
# worked out by cargueiro from the rancher-version annotation, the appVersion and
# the versions already released.
#
# The action is pinned to a commit of the chart-owners branch of rancher/charts,
# which holds only the shared actions, so it moves only when they change.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: stage-rancher-compliance-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  stage-chart:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for vault
    steps:
      - name: Ensure ref is a tag
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "::error::This workflow must run on a tag ref (got ${GITHUB_REF_TYPE} '${GITHUB_REF}')"
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare the charts
        env:
          TAG: ${{ github.ref_name }}
        run: ./.github/workflows/scripts/prepare-charts.sh "$TAG" "$RUNNER_TEMP/charts"

      - name: Stage the charts and notify rancher/charts
        # Please keep this action on the chart-owners branch and do not pin it to a commit.
        # The branch carries the checks that stop a faulty release, for example that the
        # images of the chart are pushed before the chart. A commit keeps only the checks
        # that existed when it was copied.
        uses: rancher/charts/.github/actions/ship-family-staged@chart-owners
        with:
          family: rancher-compliance
          chart-dirs: |
            ${{ runner.temp }}/charts/rancher-compliance
            ${{ runner.temp }}/charts/rancher-compliance-crd
