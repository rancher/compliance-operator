name: Label issue
on:
  issues:
    types:
      - opened
      - reopened
      
permissions: {}
  
jobs:
  label_issues:
    runs-on: org-${{ github.repository_owner_id }}-amd64-k8s
    container: ghcr.io/rancher/ci-image/go1.27 # zizmor: ignore[unpinned-images] -- internal image is exempt from this rule
    permissions:
      issues: write
    steps:
      - name: Label issue
        id: run
        run: gh issue edit -R ${GITHUB_REPOSITORY} --add-label ${LABEL} ${{ github.event.issue.number }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: "team/security"
